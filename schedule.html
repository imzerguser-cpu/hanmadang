<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>내 체험 일정 · 오(5)길잘했어! 2026 서천교육한마당</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="wrap">
    <header class="top"><a href="index.html">← 처음으로</a><span style="flex:1"></span><button class="btn small hidden" id="logout" type="button">다른 사람으로</button></header>

    <section id="login">
      <h1>내 체험 일정</h1>
      <p class="lead">배정된 체험 시간표와 길 안내를 볼 수 있어요. 체험을 마치면 그 길에 도장이 찍혀요.</p>
      <div class="row" role="tablist" style="margin:12px 0">
        <button class="btn" type="button" data-mode="person" aria-pressed="true">개인으로 신청했어요</button>
        <button class="btn" type="button" data-mode="group" aria-pressed="false">모둠 코드가 있어요</button>
      </div>
      <form id="form-person" class="card">
        <label class="field">학생 안내코드<input id="code" maxlength="6" autocapitalize="characters" autocomplete="off"><span class="hint" id="code-who" aria-live="polite"></span></label>
        <label class="field">별명<span class="hint">신청할 때 쓴 별명</span><input id="name" maxlength="20"></label>
        <label class="field">비밀번호 4자리<input id="pin" type="password" inputmode="numeric" maxlength="4"></label>
        <button class="btn primary block" id="go-person" type="submit">일정 보기</button>
      </form>
      <form id="form-group" class="card hidden">
        <label class="field">모둠 코드<span class="hint">담임 선생님이 알려 준 6자리</span>
          <input id="gcode" maxlength="6" autocapitalize="characters"></label>
        <button class="btn primary block" id="go-group" type="submit">일정 보기</button>
      </form>
      <p class="muted" style="font-size:14px">학부모·주민은 <a href="live.html">현장 예약</a>에서 참가번호로 들어오세요.</p>
    </section>

    <section id="view" class="hidden">
      <h1 id="who"></h1>
      <div id="alert-banner" class="alert-banner hidden" role="alert"></div>
      <div id="now-card" class="card" aria-live="polite"></div>
      <div id="alarm-card" class="card"></div>
      <div class="card">
        <div class="row" style="align-items:center">
          <b style="flex:2">다섯 길 도장판</b>
          <button class="btn small" id="refresh" type="button" style="flex:none">도장 새로 고침</button>
        </div>
        <div id="stamps" class="stamps"></div>
      </div>
      <h2>시간표</h2>
      <div id="timeline"></div>
      <div id="map-box" class="card hidden">
        <div class="row" style="align-items:center">
          <button class="btn small" id="map-prev" type="button" style="flex:none">◀ 이전</button>
          <b id="map-step" style="flex:1;text-align:center"></b>
          <button class="btn small" id="map-next" type="button" style="flex:none">다음 ▶</button>
        </div>
        <b id="map-title" style="display:block;margin-top:8px"></b>
        <p id="map-dir" class="muted" style="margin:4px 0 8px"></p>
        <div id="map"></div>
      </div>
      <p class="muted" style="font-size:14px">회차 시작 5분 전까지 부스에 도착해 확인을 받아야 자리가 지켜져요. 늦으면 자리가 현장 접수로 넘어갈 수 있어요.</p>
    </section>
  </main>
  <script type="module" src="js/schedule.js"></script>
</body>
</html>
